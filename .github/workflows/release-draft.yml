name: Release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: swift build
      - name: Probar
        run: swift test
      - name: Validar recursos
        run: swift run xroll-preflight
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
