name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Compilar iOS sin firma
        run: xcodebuild -project xRoll.xcodeproj -scheme xRoll -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
  ios-navigation:
    runs-on: macos-15
    # La compilación limpia y las 30 pruebas pueden agotar 20 minutos en CI.
    # Deja margen para guardar el xcresult y cerrar el runner correctamente.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Probar navegación en simulador
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcodebuild -project xRoll.xcodeproj -scheme xRoll \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -resultBundlePath ios-navigation.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-navigation-results
          path: ios-navigation.xcresult
          retention-days: 7
