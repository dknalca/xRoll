<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">xRoll - pantalla de resultado</title>
  <desc id="desc">Resultado de practica con precision, tendencia, consistencia y siguiente accion.</desc>
  <rect width="1200" height="720" fill="#0b0d10"/>
  <rect x="42" y="34" width="1116" height="650" rx="18" fill="#12151a" stroke="#2a313a"/>
  <text x="82" y="82" fill="#6d7580" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5">RESULTADO</text>
  <text x="82" y="128" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="32" font-weight="700">Bombo y caja</text>
  <text x="82" y="158" fill="#a3abb5" font-family="Arial,sans-serif" font-size="14">68 BPM  ·  4 vueltas  ·  ritmo completo</text>
  <rect x="82" y="194" width="292" height="164" rx="14" fill="#191d23"/><text x="110" y="230" fill="#63e6be" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">PRECISION</text><text x="110" y="293" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="56" font-weight="700">82%</text><text x="110" y="331" fill="#63e6be" font-family="Arial,sans-serif" font-size="16">★★</text>
  <rect x="396" y="194" width="330" height="164" rx="14" fill="#191d23"/><text x="424" y="230" fill="#63e6be" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">TENDENCIA</text><text x="424" y="274" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="22" font-weight="700">Vas 18 ms tarde</text><text x="424" y="310" fill="#a3abb5" font-family="Arial,sans-serif" font-size="14">Mediana de golpes asociados</text><line x1="424" y1="335" x2="692" y2="335" stroke="#39444e"/><circle cx="555" cy="335" r="7" fill="#e69f00"/>
  <rect x="748" y="194" width="362" height="164" rx="14" fill="#191d23"/><text x="776" y="230" fill="#63e6be" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">CONSISTENCIA</text><text x="776" y="274" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="22" font-weight="700">Dispersión 12 ms</text><text x="776" y="310" fill="#a3abb5" font-family="Arial,sans-serif" font-size="14">La tendencia es estable.</text>
  <rect x="82" y="390" width="1028" height="128" rx="14" fill="#191d23"/><text x="110" y="428" fill="#63e6be" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIGUIENTE ACCION</text><text x="110" y="467" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="20" font-weight="700">Repite a 68 BPM y busca el centro de la linea.</text><text x="110" y="495" fill="#a3abb5" font-family="Arial,sans-serif" font-size="14">La recomendacion prioriza timing antes que otra estrella.</text>
  <rect x="82" y="550" width="310" height="58" rx="10" fill="#63e6be"/><text x="237" y="586" text-anchor="middle" fill="#0b0d10" font-family="Arial,sans-serif" font-size="16" font-weight="700">PRACTICAR DE NUEVO</text>
  <rect x="410" y="550" width="250" height="58" rx="10" fill="#20252d"/><text x="535" y="586" text-anchor="middle" fill="#f1f3f5" font-family="Arial,sans-serif" font-size="16" font-weight="700">CORREGIR SONIDO</text>
</svg>
